<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Used only by the AppImage, via FONTCONFIG_FILE (see src/main.cpp). Keeps the
  system configuration and adds the bundled Japanese fonts as a fallback, so
  Latin text still uses the system fonts and CJK text is never drawn as boxes.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir prefix="relative">.</dir>
  <alias>
    <family>serif</family>
    <accept><family>Noto Serif JP</family></accept>
  </alias>
  <alias>
    <family>sans-serif</family>
    <accept><family>Noto Sans JP</family></accept>
  </alias>
  <alias>
    <family>monospace</family>
    <accept><family>Noto Sans JP</family></accept>
  </alias>
</fontconfig>
