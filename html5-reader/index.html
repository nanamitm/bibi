<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="EPUBをブラウザー内で読む Bibi HTML5 Reader"><title>Bibi HTML5 Reader</title><link rel="icon" href="./icon.svg"></head>
<body><header><a class="brand" href="./">Bibi <small>HTML5 Reader</small></a><button id="open">EPUBを開く</button><input id="file" type="file" accept=".epub,application/epub+zip" hidden><button id="sidebar-toggle" aria-expanded="true" aria-controls="sidebar">目次・検索</button><span id="title">本を選んで読書を始めましょう</span><label>文字サイズ <select id="size"><option value="80">80%</option><option value="100" selected>100%</option><option value="120">120%</option><option value="150">150%</option><option value="200">200%</option></select></label><label>配色 <select id="theme"><option value="light">白</option><option value="sepia">セピア</option><option value="dark">暗色</option></select></label></header>
<main><aside id="sidebar"><nav class="tabs" aria-label="サイドパネル"><button data-tab="toc" aria-pressed="true">目次</button><button data-tab="search" aria-pressed="false">検索</button><button data-tab="bookmarks" aria-pressed="false">しおり</button></nav><section id="toc" class="panel"><p>本を開くと目次が表示されます。</p></section><section id="search" class="panel" hidden><form id="search-form"><label for="query">本文を検索</label><div class="search-row"><input id="query" type="search" required maxlength="200"><button id="search-button">検索</button></div></form><p id="search-status" role="status"></p><ol id="results"></ol></section><section id="bookmarks" class="panel" hidden><button id="bookmark" disabled>現在の位置を保存</button><ul id="bookmark-list"></ul></section><p class="privacy">EPUBは端末内で処理されます。書籍のアップロードは行いません。読書位置としおりはこのブラウザーに保存します。</p></aside><div class="reading"><div id="welcome"><img src="./icon.svg" alt="" width="80" height="80"><h1>いつもの本を、ブラウザーで。</h1><p>EPUB 2 / 3 · 縦書き · 目次 · 全文検索 · しおり</p><p>「EPUBを開く」またはここにファイルをドロップ</p><button id="sample">サンプルを読む</button></div><div id="viewer" hidden></div></div></main>
<footer><button id="previous" disabled>前へ</button><span id="status" role="status" aria-live="polite">EPUBファイルを選択してください</span><button id="next" disabled>次へ</button></footer><script type="module" src="./src/main.js"></script></body></html>
